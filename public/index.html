<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>WABOT</title>
<style>body{font-family:sans-serif;background:#0b141a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:#111b21;padding:25px;border-radius:16px;width:95%;max-width:380px;text-align:center}input{width:100%;padding:14px;border-radius:10px;border:none;margin:12px 0;background:#202c33;color:#fff}button{width:100%;padding:14px;background:#25D366;border:none;border-radius:10px;font-weight:bold}</style></head><body>
<div class="card"><h1 style="color:#25D366">WABOT 🤖</h1><input id="num" placeholder="233..."><button onclick="fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:num.value})}).then(r=>r.json()).then(d=>out.innerText=d.code)">Get 8-Digit Code</button><div id="out" style="margin-top:20px;font-size:28px"></div></div></body></html>
