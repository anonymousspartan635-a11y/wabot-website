<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>WABOT Pair</title>
<style>body{background:#0b141a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.box{background:#111b21;padding:25px;border-radius:16px;width:90%;max-width:400px;text-align:center}input{width:100%;padding:14px;border-radius:10px;border:none;background:#202c33;color:#fff;margin:12px 0}button{width:100%;padding:14px;background:#25D366;border:none;border-radius:10px;font-weight:bold;cursor:pointer}code{font-size:28px;letter-spacing:3px;display:block;margin-top:20px;color:#25D366}</style></head><body>
<div class="box"><h2>🤖 WABOT PAIR</h2><p>Enter WhatsApp number with country code</p><input id="num" placeholder="233247123456"><button id="btn">Get 8-Digit Code</button><code id="out"></code><small id="msg"></small></div>
<script>btn.onclick=async()=>{out.textContent='...';msg.textContent='Generating...';let r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:num.value})});let d=await r.json();if(d.code){out.textContent=d.code;msg.textContent='Go to WhatsApp > Linked Devices > Link with phone number';}else{out.textContent='';msg.textContent=d.error}}</script></body></html>
